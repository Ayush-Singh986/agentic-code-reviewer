<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="white"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Agentic Code Reviewer Architecture
  </text>
  
  <!-- Input Layer -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#e1f5ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">Input Layer</text>
    <text x="100" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Code Change</text>
    <text x="100" y="70" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">(PR/Commit/Local)</text>
  </g>
  
  <line x1="250" y1="130" x2="280" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Pre-Processing Layer -->
  <g transform="translate(280, 80)">
    <rect x="0" y="0" width="200" height="200" rx="8" fill="#fff3e0" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">Pre-Processing</text>
    
    <rect x="10" y="40" width="180" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="100" y="65" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Diff Ingestion</text>
    
    <rect x="10" y="90" width="180" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="100" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Planner</text>
    <text x="100" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Strategy</text>
    
    <rect x="10" y="140" width="180" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="100" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Change Analyzer</text>
    
    <rect x="10" y="190" width="180" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="100" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Context Retrieval</text>
    <text x="100" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">RAG</text>
  </g>
  
  <line x1="480" y1="180" x2="520" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Parallel Analysis Layer -->
  <g transform="translate(520, 40)">
    <rect x="0" y="0" width="320" height="320" rx="8" fill="#f3e5f5" stroke="#a855f7" stroke-width="2"/>
    <text x="160" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">Parallel Analysis (25 Agents)</text>
    
    <!-- Agent Grid -->
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="22" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Correctness</text>
      
      <rect x="0" y="45" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="67" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Security</text>
      
      <rect x="0" y="90" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="112" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Testing</text>
      
      <rect x="0" y="135" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="157" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Performance</text>
      
      <rect x="0" y="180" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="202" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Architecture</text>
      
      <rect x="0" y="225" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="247" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Accessibility</text>
      
      <rect x="0" y="270" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="292" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Concurrency</text>
    </g>
    
    <g transform="translate(160, 40)">
      <rect x="0" y="0" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="22" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Error Handling</text>
      
      <rect x="0" y="45" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="67" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Dependencies</text>
      
      <rect x="0" y="90" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="112" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Privacy</text>
      
      <rect x="0" y="135" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="157" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Compliance</text>
      
      <rect x="0" y="180" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="202" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Dead Code</text>
      <text x="75" y="217" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#64748b">(Deterministic)</text>
      
      <rect x="0" y="225" width="150" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="75" y="247" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">More Agents...</text>
      
      <rect x="0" y="270" width="150" height="35" rx="6" fill="#e0f2fe" stroke="#93c5fd" stroke-width="1"/>
      <text x="75" y="292" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">25 Total</text>
    </g>
  </g>
  
  <line x1="840" y1="180" x2="880" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Verification Layer -->
  <g transform="translate(880, 80)">
    <rect x="0" y="0" width="280" height="200" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="140" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">Verification Layer</text>
    
    <rect x="10" y="40" width="260" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="140" y="65" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Regex Verification</text>
    
    <rect x="10" y="90" width="260" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="140" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">AST Analysis</text>
    
    <rect x="10" y="140" width="260" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="140" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Symbol Resolution</text>
    
    <rect x="10" y="190" width="260" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="140" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Taint Tracking</text>
  </g>
  
  <line x1="1160" y1="180" x2="1190" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Output Layer -->
  <g transform="translate(1190, 100)">
    <rect x="0" y="0" width="180" height="160" rx="8" fill="#fffde7" stroke="#eab308" stroke-width="2"/>
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">Output Layer</text>
    
    <rect x="10" y="50" width="160" height="35" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="90" y="72" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">Final Review</text>
    
    <rect x="10" y="95" width="160" height="35" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="90" y="117" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#15803d">Markdown</text>
    
    <rect x="10" y="130" width="160" height="35" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="90" y="152" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#15803d">JSON</text>
    
    <rect x="10" y="165" width="160" height="35" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="90" y="187" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#15803d">SARIF 2.1.0</text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <g transform="translate(50, 650)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Key Features:</text>
    
    <rect x="0" y="20" width="20" height="20" rx="4" fill="#f3e5f5" stroke="#a855f7" stroke-width="1"/>
    <text x="30" y="35" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Parallel Processing: 25 agents run simultaneously</text>
    
    <rect x="0" y="50" width="20" height="20" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="30" y="65" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Graceful Degradation: Agent failures don't stop review</text>
    
    <rect x="0" y="80" width="20" height="20" rx="4" fill="#fff3e0" stroke="#f59e0b" stroke-width="1"/>
    <text x="30" y="95" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Evidence-Based Verification: 4 verification layers</text>
    
    <rect x="0" y="110" width="20" height="20" rx="4" fill="#fffde7" stroke="#eab308" stroke-width="1"/>
    <text x="30" y="125" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Deterministic Fallbacks: Rules-based alternatives</text>
  </g>
  
  <!-- Performance Metrics -->
  <g transform="translate(700, 650)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Performance:</text>
    
    <rect x="0" y="20" width="180" height="25" rx="4" fill="#e0f2fe" stroke="#93c5fd" stroke-width="1"/>
    <text x="10" y="37" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">⏱️ 3-5 minute reviews (vs 30-60 min manual)</text>
    
    <rect x="0" y="55" width="180" height="25" rx="4" fill="#e0f2fe" stroke="#93c5fd" stroke-width="1"/>
    <text x="10" y="72" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">🚀 10-15x speedup with parallel agents</text>
    
    <rect x="0" y="90" width="180" height="25" rx="4" fill="#e0f2fe" stroke="#93c5fd" stroke-width="1"/>
    <text x="10" y="107" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">✅ 99.2% completion rate with graceful degradation</text>
    
    <rect x="0" y="125" width="180" height="25" rx="4" fill="#e0f2fe" stroke="#93c5fd" stroke-width="1"/>
    <text x="10" y="142" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">📊 60% cost reduction through context optimization</text>
  </g>
  
  <!-- TUI Screenshots -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="580" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="10" y="25" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Interactive Dashboard:</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Live pipeline • Findings browser • Category grouping • Command palette</text>
  </g>
</svg>